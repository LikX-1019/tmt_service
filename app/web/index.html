<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="电商智能客服 API 测试页面">
  <title>小满客服 · 智能对话台</title>
  <style>
    :root {
      --ink: #17352f;
      --ink-soft: #5f746f;
      --paper: #fffdf7;
      --panel: rgba(255, 255, 255, 0.88);
      --line: rgba(26, 70, 60, 0.12);
      --brand: #0f766e;
      --brand-deep: #0b5954;
      --accent: #f26b4f;
      --accent-soft: #fff0e9;
      --success: #25a36f;
      --danger: #c84444;
      --shadow: 0 24px 70px rgba(25, 62, 53, 0.14);
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 8%, rgba(242, 107, 79, 0.18), transparent 26rem),
        radial-gradient(circle at 88% 90%, rgba(15, 118, 110, 0.16), transparent 30rem),
        #f5f2e9;
      font-family: "Microsoft YaHei UI", "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
    }

    button, textarea { font: inherit; }

    .shell {
      width: min(1180px, calc(100% - 32px));
      min-height: 100vh;
      margin: 0 auto;
      padding: 28px 0;
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      gap: 20px;
    }

    .sidebar,
    .chat-panel {
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 28px;
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .sidebar {
      padding: 28px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    .sidebar::after {
      content: "";
      width: 180px;
      height: 180px;
      position: absolute;
      right: -80px;
      bottom: -70px;
      border-radius: 50%;
      background: linear-gradient(145deg, rgba(242, 107, 79, 0.22), rgba(15, 118, 110, 0.08));
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      border-radius: 15px;
      color: white;
      background: linear-gradient(145deg, var(--brand), var(--brand-deep));
      box-shadow: 0 10px 25px rgba(15, 118, 110, 0.25);
      font-size: 22px;
    }

    .brand h1 {
      margin: 0;
      font-size: 18px;
      letter-spacing: 0.04em;
    }

    .brand p {
      margin: 3px 0 0;
      color: var(--ink-soft);
      font-size: 12px;
    }

    .status-card {
      margin-top: 42px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255, 253, 247, 0.7);
    }

    .status-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 13px;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      display: inline-block;
      margin-right: 7px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 0 5px rgba(37, 163, 111, 0.1);
    }

    .endpoint {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
      color: var(--ink-soft);
      font: 12px/1.6 ui-monospace, SFMono-Regular, Consolas, monospace;
      overflow-wrap: anywhere;
    }

    .tips {
      margin-top: 34px;
      position: relative;
      z-index: 1;
    }

    .tips-label {
      margin: 0 0 12px;
      color: var(--ink-soft);
      font-size: 12px;
      letter-spacing: 0.08em;
    }

    .suggestion {
      width: 100%;
      margin-bottom: 9px;
      padding: 11px 13px;
      border: 1px solid var(--line);
      border-radius: 13px;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.72);
      cursor: pointer;
      text-align: left;
      transition: transform 160ms ease, border-color 160ms ease, background 160ms ease;
    }

    .suggestion:hover {
      transform: translateX(3px);
      border-color: rgba(15, 118, 110, 0.35);
      background: white;
    }

    .privacy-note {
      margin-top: auto;
      padding-top: 28px;
      color: var(--ink-soft);
      font-size: 11px;
      line-height: 1.7;
      position: relative;
      z-index: 1;
    }

    .chat-panel {
      min-height: calc(100vh - 56px);
      overflow: hidden;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    .chat-header {
      padding: 24px 28px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      border-bottom: 1px solid var(--line);
    }

    .chat-header h2 {
      margin: 0;
      font-size: 20px;
    }

    .chat-header p {
      margin: 5px 0 0;
      color: var(--ink-soft);
      font-size: 13px;
    }

    .clear-button {
      padding: 9px 13px;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--ink-soft);
      background: transparent;
      cursor: pointer;
    }

    .clear-button:hover { color: var(--brand); border-color: var(--brand); }

    .messages {
      min-height: 0;
      padding: 30px 28px;
      overflow-y: auto;
      scroll-behavior: smooth;
    }

    .message {
      max-width: min(76%, 720px);
      margin-bottom: 22px;
      animation: rise 220ms ease-out;
    }

    .message.user { margin-left: auto; }

    .message-role {
      margin: 0 0 7px 3px;
      color: var(--ink-soft);
      font-size: 11px;
      letter-spacing: 0.06em;
    }

    .message.user .message-role { text-align: right; margin-right: 3px; }

    .bubble {
      padding: 14px 17px;
      border-radius: 18px 18px 18px 5px;
      background: white;
      border: 1px solid var(--line);
      line-height: 1.75;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .message.user .bubble {
      color: white;
      border: 0;
      border-radius: 18px 18px 5px 18px;
      background: linear-gradient(145deg, var(--brand), var(--brand-deep));
      box-shadow: 0 12px 28px rgba(15, 118, 110, 0.2);
    }

    .message.error .bubble {
      color: var(--danger);
      border-color: rgba(200, 68, 68, 0.22);
      background: #fff7f5;
    }

    .message-meta {
      margin: 7px 3px 0;
      color: var(--ink-soft);
      font: 10px/1.5 ui-monospace, SFMono-Regular, Consolas, monospace;
    }

    .typing {
      display: inline-flex;
      gap: 5px;
      align-items: center;
      min-height: 24px;
    }

    .typing i {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--brand);
      animation: blink 1s infinite ease-in-out;
    }

    .typing i:nth-child(2) { animation-delay: 120ms; }
    .typing i:nth-child(3) { animation-delay: 240ms; }

    .composer-wrap {
      padding: 18px 24px 22px;
      border-top: 1px solid var(--line);
      background: rgba(255, 253, 247, 0.68);
    }

    .composer {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: end;
      gap: 12px;
      padding: 10px 10px 10px 16px;
      border: 1px solid rgba(15, 118, 110, 0.2);
      border-radius: 19px;
      background: white;
      box-shadow: 0 8px 24px rgba(31, 67, 59, 0.08);
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }

    .composer:focus-within {
      border-color: var(--brand);
      box-shadow: 0 0 0 4px rgba(15, 118, 110, 0.08);
    }

    textarea {
      width: 100%;
      min-height: 46px;
      max-height: 150px;
      padding: 11px 0;
      resize: none;
      border: 0;
      outline: 0;
      color: var(--ink);
      background: transparent;
      line-height: 1.55;
    }

    textarea::placeholder { color: #97a6a2; }

    .send-button {
      min-width: 92px;
      height: 46px;
      border: 0;
      border-radius: 14px;
      color: white;
      background: var(--accent);
      box-shadow: 0 9px 20px rgba(242, 107, 79, 0.24);
      cursor: pointer;
      font-weight: 700;
      transition: transform 150ms ease, filter 150ms ease;
    }

    .send-button:hover:not(:disabled) { transform: translateY(-1px); filter: brightness(0.96); }
    .send-button:disabled { cursor: wait; opacity: 0.58; }

    .composer-help {
      margin: 8px 4px 0;
      color: var(--ink-soft);
      font-size: 11px;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes blink {
      0%, 60%, 100% { opacity: 0.25; transform: translateY(0); }
      30% { opacity: 1; transform: translateY(-3px); }
    }

    @media (max-width: 800px) {
      .shell {
        width: 100%;
        min-height: 100svh;
        padding: 0;
        display: block;
      }

      .sidebar { display: none; }

      .chat-panel {
        min-height: 100svh;
        border: 0;
        border-radius: 0;
      }

      .chat-header, .messages { padding-left: 18px; padding-right: 18px; }
      .composer-wrap { padding: 14px; }
      .message { max-width: 88%; }
      .send-button { min-width: 72px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">满</div>
        <div>
          <h1>小满客服</h1>
          <p>Customer Care Console</p>
        </div>
      </div>

      <section class="status-card" aria-label="接口状态">
        <div class="status-line">
          <span><i class="status-dot"></i>服务已连接</span>
          <strong id="requestCount">0 次</strong>
        </div>
        <div class="endpoint">POST /api/v1/chat</div>
      </section>

      <section class="tips">
        <p class="tips-label">快捷提问</p>
        <button class="suggestion" type="button">介绍一下你能做什么</button>
        <button class="suggestion" type="button">商品不合适怎么办？</button>
        <button class="suggestion" type="button">如何联系人工客服？</button>
      </section>

      <p class="privacy-note">
        页面不会保存聊天记录。后端日志仅记录调用状态，不记录完整用户消息和 API Key。
      </p>
    </aside>

    <section class="chat-panel" aria-label="智能客服对话">
      <header class="chat-header">
        <div>
          <h2>智能对话台</h2>
          <p>正在使用已配置的大模型生成回复</p>
        </div>
        <button id="clearButton" class="clear-button" type="button">清空对话</button>
      </header>

      <div id="messages" class="messages" aria-live="polite">
        <article class="message assistant">
          <p class="message-role">小满客服</p>
          <div class="bubble">您好，我是小满客服。您可以在这里测试智能客服接口，请问有什么可以帮您？</div>
        </article>
      </div>

      <footer class="composer-wrap">
        <form id="chatForm" class="composer">
          <textarea
            id="messageInput"
            maxlength="4000"
            rows="1"
            autocomplete="off"
            placeholder="输入您想咨询的问题……"
            aria-label="聊天消息"
          ></textarea>
          <button id="sendButton" class="send-button" type="submit">发送</button>
        </form>
        <p class="composer-help">Enter 发送 · Shift + Enter 换行 · 最多 4000 字</p>
      </footer>
    </section>
  </main>

  <script>
    const API_URL = "/api/v1/chat";
    const messages = document.querySelector("#messages");
    const form = document.querySelector("#chatForm");
    const input = document.querySelector("#messageInput");
    const sendButton = document.querySelector("#sendButton");
    const clearButton = document.querySelector("#clearButton");
    const requestCount = document.querySelector("#requestCount");
    let completedRequests = 0;

    // 统一创建消息节点，并使用 textContent 防止模型回复被当成 HTML 执行。
    function appendMessage(role, text, meta = "", isError = false) {
      const article = document.createElement("article");
      article.className = `message ${role}${isError ? " error" : ""}`;

      const roleLabel = document.createElement("p");
      roleLabel.className = "message-role";
      roleLabel.textContent = role === "user" ? "您" : "小满客服";

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;

      article.append(roleLabel, bubble);
      if (meta) {
        const metaLine = document.createElement("p");
        metaLine.className = "message-meta";
        metaLine.textContent = meta;
        article.append(metaLine);
      }
      messages.append(article);
      messages.scrollTop = messages.scrollHeight;
      return article;
    }

    // 模型生成期间显示动态占位，响应完成后由真实消息替换。
    function appendTyping() {
      const article = document.createElement("article");
      article.className = "message assistant";
      article.innerHTML = `
        <p class="message-role">小满客服</p>
        <div class="bubble"><span class="typing" aria-label="正在生成回复"><i></i><i></i><i></i></span></div>
      `;
      messages.append(article);
      messages.scrollTop = messages.scrollHeight;
      return article;
    }

    // 根据内容高度自动调整输入框，避免长问题遮挡聊天区域。
    function resizeInput() {
      input.style.height = "auto";
      input.style.height = `${Math.min(input.scrollHeight, 150)}px`;
    }

    async function sendMessage(rawMessage) {
      const message = rawMessage.trim();
      if (!message || sendButton.disabled) return;

      appendMessage("user", message);
      input.value = "";
      resizeInput();
      sendButton.disabled = true;
      sendButton.textContent = "生成中";
      const typing = appendTyping();
      const started = performance.now();
      const requestId = crypto.randomUUID?.() ?? `${Date.now()}-${Math.random()}`;

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-Request-ID": requestId,
          },
          body: JSON.stringify({ message }),
        });
        const payload = await response.json();
        const responseRequestId = response.headers.get("X-Request-ID") || requestId;
        const elapsed = Math.round(performance.now() - started);
        typing.remove();

        if (!response.ok || payload.code !== 0) {
          throw new Error(`${payload.message || "请求失败"} · HTTP ${response.status} · ${responseRequestId}`);
        }
        appendMessage(
          "assistant",
          payload.data?.answer || "模型没有返回文本内容。",
          `${elapsed} ms · ${responseRequestId}`,
        );
      } catch (error) {
        typing.remove();
        appendMessage(
          "assistant",
          error instanceof Error ? error.message : "请求失败，请检查后端服务。",
          "请使用 request_id 在 error 日志中定位",
          true,
        );
      } finally {
        completedRequests += 1;
        requestCount.textContent = `${completedRequests} 次`;
        sendButton.disabled = false;
        sendButton.textContent = "发送";
        input.focus();
      }
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      void sendMessage(input.value);
    });

    input.addEventListener("input", resizeInput);
    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        form.requestSubmit();
      }
    });

    document.querySelectorAll(".suggestion").forEach((button) => {
      button.addEventListener("click", () => void sendMessage(button.textContent));
    });

    clearButton.addEventListener("click", () => {
      messages.replaceChildren();
      appendMessage("assistant", "对话已清空，我们重新开始吧。请问有什么可以帮您？");
      input.focus();
    });
  </script>
</body>
</html>
