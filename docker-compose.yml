# macOS 镜像存储：在 Docker Desktop > Settings > Resources > Advanced 中
# 将 Disk image location 设置为 /Users/li001/Desktop/tmt/develop/docker-01。
# 此项是 Docker Desktop 全局设置，不能通过 Compose 的 image 字段指定。
# 持久化数据：默认保存在当前 worktree 的 ./data/docker；可用 COMPOSE_DATA_DIR
# 指向隔离目录。容器、网络由 Compose project name 自动命名，避免 worktree 冲突。
# 本机配置及验证方法见 docs/Docker本机存储配置.md。
services:
  mysql:
    image: mysql:8.0.43
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3306}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    volumes:
      - ${COMPOSE_DATA_DIR:-./data/docker}/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - customer-service-network

  product-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      POSTGRES_DB: ${PRODUCT_POSTGRES_DB}
      POSTGRES_USER: ${PRODUCT_POSTGRES_USER}
      POSTGRES_PASSWORD: ${PRODUCT_POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${PRODUCT_POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - ${COMPOSE_DATA_DIR:-./data/docker}/product-postgres:/var/lib/postgresql/data
      - ./docker/product-postgres/init:/docker-entrypoint-initdb.d:ro
      - ./docker/product-postgres/sql/product_api_profiles.sql:/opt/product-postgres/product_api_profiles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - customer-service-network

  commodity-management:
    build:
      context: ./commodity_management
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      DATABASE_HOST: product-postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${PRODUCT_POSTGRES_DB}
      DATABASE_USER: ${PRODUCT_POSTGRES_USER}
      DATABASE_PASSWORD: ${PRODUCT_POSTGRES_PASSWORD}
      COMMODITY_ADMIN_USERNAME: ${COMMODITY_ADMIN_USERNAME}
      COMMODITY_ADMIN_PASSWORD: ${COMMODITY_ADMIN_PASSWORD}
      COMMODITY_SESSION_SECRET: ${COMMODITY_SESSION_SECRET}
      PRODUCT_API_BEARER_TOKEN: ${PRODUCT_API_BEARER_TOKEN}
    ports:
      - "${COMMODITY_MANAGEMENT_BIND:-0.0.0.0}:${COMMODITY_MANAGEMENT_PORT}:8080"
    depends_on:
      product-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - customer-service-network

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command:
      - etcd
      - --advertise-client-urls=http://127.0.0.1:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --data-dir=/etcd
    volumes:
      - ${COMPOSE_DATA_DIR:-./data/docker}/etcd:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - customer-service-network

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${MINIO_API_PORT}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT}:9001"
    command: server /data --console-address ":9001"
    volumes:
      - ${COMPOSE_DATA_DIR:-./data/docker}/minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - customer-service-network

  milvus:
    image: milvusdb/milvus:v2.5.12
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${MILVUS_HOST_PORT:-19530}:19530"
      - "127.0.0.1:${MILVUS_METRICS_PORT}:9091"
    volumes:
      - ${COMPOSE_DATA_DIR:-./data/docker}/milvus:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - customer-service-network

  attu:
    image: zilliz/attu:v2.4.12
    restart: unless-stopped
    environment:
      MILVUS_URL: milvus:19530
    ports:
      - "127.0.0.1:${ATTU_PORT}:3000"
    depends_on:
      milvus:
        condition: service_healthy
    networks:
      - customer-service-network

networks:
  customer-service-network:
    driver: bridge
